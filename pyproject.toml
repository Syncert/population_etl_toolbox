[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ingestion-toolbox"
version = "0.1.0"
description = "ETL toolbox for Census ACS, BLS, and FRED data pipelines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "data_ingestion_toolbox contributors" }]
license = "LicenseRef-Proprietary"
dependencies = [
  "httpx>=0.27,<1.0",
  "polars>=0.20,<2.0",
  "psycopg2-binary>=2.9,<3.0",
  "pydantic>=2.6,<3.0",
  "pyshp>=2.3,<3.0",
  "requests>=2.31,<3.0",
  "tenacity>=8.2,<10.0",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
airflow = [
  "apache-airflow==2.9.3",
  "apache-airflow-providers-postgres==5.11.2",
]
api = [
  "fastapi>=0.111,<1.0",
  "redis>=5.0,<6.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0.48,<3.0",
]
dev = [
  "build==1.2.2.post1",
  "PyYAML==6.0.3",
  "pytest==8.3.4",
  "pytest-cov==5.0.0",
  "ruff==0.15.16",
]
martin-test = [
  "mapbox-vector-tile==2.2.0",
]
performance = [
  "locust==2.32.6",
]
local = [
  "data-ingestion-toolbox[api,dev,martin-test,performance]",
]
airflow-dev = [
  "data-ingestion-toolbox[airflow,dev]",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
data_ingestion_toolbox = ["**/*.sql", "sql/remediation/*.md"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["apps.api*", "data_ingestion_toolbox*"]
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Covers: ENV-004 — unknown pytest markers fail collection.
addopts = "--strict-markers -m 'not database and not redis and not martin and not external and not e2e and not performance and not slow'"
filterwarnings = [
  "error::pytest.PytestUnhandledCoroutineWarning",
  "error::ResourceWarning",
  "error::DeprecationWarning:apps.*",
  "error::DeprecationWarning:data_ingestion_toolbox.*",
  "error::DeprecationWarning:tests.*",
]
markers = [
  "unit: deterministic, process-local logic; no network or infrastructure",
  "dag: Airflow DAG import and structure tests; requires airflow-dev environment",
  "api: FastAPI router, service, schema, or middleware tests",
  "integration: tests that exercise multiple real application components",
  "database: requires the pinned disposable PostGIS 16 container",
  "redis: requires a disposable Redis 7 service",
  "martin: requires a disposable Martin vector-tile service",
  "external: live external-source contract tests; scheduled only",
  "e2e: raw-to-API deterministic end-to-end fixture flow",
  "performance: load, volume, or benchmark scenarios",
  "slow: expected duration exceeds 30 seconds",
  "frontend: JavaScript unit, component, or browser contract",
  "deployment: container, proxy, or composed-service contract",
]
