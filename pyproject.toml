[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ingestion-toolbox"
version = "0.1.0"
description = "ETL toolbox for Census ACS, BLS, and FRED data pipelines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "data_ingestion_toolbox contributors" }]
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.27,<1.0",
  "polars>=0.20,<2.0",
  "psycopg2-binary>=2.9,<3.0",
  "pydantic>=2.6,<3.0",
  "pyshp>=2.3,<3.0",
  "requests>=2.31,<3.0",
  "tenacity>=8.2,<10.0",
]

[project.optional-dependencies]
airflow = [
  "apache-airflow>=2.8,<3.0",
  "apache-airflow-providers-postgres>=5.10,<7.0",
]
api = [
  "fastapi>=0.111,<1.0",
  "redis>=5.0,<6.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0.48,<3.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
]
local = [
  "data-ingestion-toolbox[api,dev]",
]
airflow-dev = [
  "data-ingestion-toolbox[airflow,dev]",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["apps*", "data_ingestion_toolbox*"]
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
