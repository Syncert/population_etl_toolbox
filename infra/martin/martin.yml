# Martin expands environment variables in config files at startup.
listen_addresses: "0.0.0.0:3000"
base_path: /tiles

postgres:
  connection_string: ${MARTIN_DATABASE_URL}
  auto_publish: false
  tables:
    # The layer keeps its name: the web selects it by id and the grains it
    # draws are unchanged. What changed is that the relation behind it no
    # longer carries the 32k place polygons the boundary cannot draw (DB-053).
    counties:
      layer_id: counties
      schema: gold
      table: tile_boundary
      geometry_column: geo_geom
      id_column: ~
      srid: 4326
      minzoom: 0
      maxzoom: 12
      bounds: [-180.0, -90.0, 180.0, 90.0]
      properties:
        geo_id: text
        geo_level: text
        state_fips: text
        county_fips: text
        state_name: text
        county_name: text
        latitude: float8
        longitude: float8
    # Census tracts (sub-county-geography), from their own relation so the
    # county layer does not carry them. Drawn from zoom 6, where one county's
    # tracts become legible.
    tracts:
      layer_id: tracts
      schema: gold
      table: tile_tract
      geometry_column: geo_geom
      id_column: ~
      srid: 4326
      minzoom: 6
      maxzoom: 14
      bounds: [-180.0, -90.0, 180.0, 90.0]
      properties:
        geo_id: text
        geo_level: text
        state_fips: text
        county_fips: text
        county_name: text
        area_name: text
        latitude: float8
        longitude: float8
  # Cities and towns (Census places) and metros (CBSAs), versioned by boundary
  # vintage (tiles-places-and-metros). Function sources rather than tables,
  # because a table source cannot take a parameter: `?vintage=YYYY` draws that
  # vintage's boundaries, and no vintage draws the newest. A vintage the layer
  # does not hold draws nothing; it never falls back to another one.
  # `/api/v1/catalog/tile-layers` lists the vintages each layer holds.
  functions:
    places:
      schema: gold
      function: tile_places
      minzoom: 6
      maxzoom: 14
      bounds: [-180.0, -90.0, 180.0, 90.0]
    metros:
      schema: gold
      function: tile_metros
      minzoom: 0
      maxzoom: 12
      bounds: [-180.0, -90.0, 180.0, 90.0]
