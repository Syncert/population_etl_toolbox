name: population-testing

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine@sha256:b193e996618e9e632e2c6e268462b350c28a9c871cb0352b32905fc01e0299bd
    environment:
      POSTGRES_USER: population_test
      POSTGRES_PASSWORD: population_test
      POSTGRES_DB: population_etl_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_HOST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../sql/migrations/001_raw_capture_control_foundation.sql:/docker-entrypoint-initdb.d/000_migration_001.sql:ro
      - ../../sql/migrations/002_gold_glossary_decoupling.sql:/docker-entrypoint-initdb.d/005_migration_002.sql:ro
      - ../../sql/migrations/021_geo_grain_vocabulary_early.sql:/docker-entrypoint-initdb.d/010_migration_021.sql:ro
      - ../../sql/migrations/023_geo_name_vocabulary_early.sql:/docker-entrypoint-initdb.d/015_migration_023.sql:ro
      - ../../sql/migrations/013_data_quality_evidence.sql:/docker-entrypoint-initdb.d/020_migration_013.sql:ro
      - ../../src/data_ingestion_toolbox/silver_ref/DDL/silver_ref.sql:/docker-entrypoint-initdb.d/025_reference.sql:ro
      - ../../src/data_ingestion_toolbox/census_acs/DDL/raw_census.sql:/docker-entrypoint-initdb.d/030_raw_census.sql:ro
      - ../../src/data_ingestion_toolbox/bls/DDL/raw_bls.sql:/docker-entrypoint-initdb.d/035_raw_bls.sql:ro
      - ../../src/data_ingestion_toolbox/fred/DDL/raw_fred.sql:/docker-entrypoint-initdb.d/040_raw_fred.sql:ro
      - ../../src/data_ingestion_toolbox/census_acs/DDL/silver_census.sql:/docker-entrypoint-initdb.d/045_silver_census.sql:ro
      - ../../src/data_ingestion_toolbox/bls/DDL/silver_bls.sql:/docker-entrypoint-initdb.d/050_silver_bls.sql:ro
      - ../../src/data_ingestion_toolbox/fred/DDL/silver_fred.sql:/docker-entrypoint-initdb.d/055_silver_fred.sql:ro
      - ../../sql/migrations/004_fred_capture_cutover.sql:/docker-entrypoint-initdb.d/060_migration_004.sql:ro
      - ../../sql/migrations/005_census_acs_capture_cutover.sql:/docker-entrypoint-initdb.d/065_migration_005.sql:ro
      - ../../sql/migrations/006_bls_capture_cutover.sql:/docker-entrypoint-initdb.d/070_migration_006.sql:ro
      - ../../sql/migrations/007_remove_legacy_parsed_raw.sql:/docker-entrypoint-initdb.d/075_migration_007.sql:ro
      - ../../sql/migrations/008_geography_reference_cutover.sql:/docker-entrypoint-initdb.d/080_migration_008.sql:ro
      - ../../sql/migrations/009_census_pep_registry.sql:/docker-entrypoint-initdb.d/085_migration_009.sql:ro
      - ../../src/data_ingestion_toolbox/census_pep/DDL/silver_pep.sql:/docker-entrypoint-initdb.d/090_silver_pep.sql:ro
      - ../../sql/migrations/015_census_pep_historical_series.sql:/docker-entrypoint-initdb.d/095_migration_015.sql:ro
      - ../../src/data_ingestion_toolbox/cdc/DDL/silver_cdc.sql:/docker-entrypoint-initdb.d/100_silver_cdc.sql:ro
      - ../../src/data_ingestion_toolbox/fbi_ucr/DDL/silver_fbi.sql:/docker-entrypoint-initdb.d/105_silver_fbi.sql:ro
      - ../../src/data_ingestion_toolbox/usda_nass/DDL/silver_nass.sql:/docker-entrypoint-initdb.d/110_silver_nass.sql:ro
      - ../../sql/migrations/019_stratum_shape_contract.sql:/docker-entrypoint-initdb.d/115_migration_019.sql:ro
      - ../../sql/migrations/025_county_label_is_not_reviewed.sql:/docker-entrypoint-initdb.d/120_migration_025.sql:ro
      - ../../sql/migrations/027_acs_bls_fact_lineage.sql:/docker-entrypoint-initdb.d/125_migration_027.sql:ro
      - ../../src/data_ingestion_toolbox/census_acs/gold_census/DDL/gold_acs.sql:/docker-entrypoint-initdb.d/130_gold_census.sql:ro
      - ../../src/data_ingestion_toolbox/bls/gold_bls/DDL/gold_bls.sql:/docker-entrypoint-initdb.d/135_gold_bls.sql:ro
      - ../../src/data_ingestion_toolbox/fred/gold_fred/DDL/gold_fred.sql:/docker-entrypoint-initdb.d/140_gold_fred.sql:ro
      - ../../src/data_ingestion_toolbox/census_pep/gold_pep/DDL/gold_pep.sql:/docker-entrypoint-initdb.d/145_gold_pep.sql:ro
      - ../../src/data_ingestion_toolbox/cdc/gold_cdc/DDL/gold_cdc.sql:/docker-entrypoint-initdb.d/150_gold_cdc.sql:ro
      - ../../src/data_ingestion_toolbox/fbi_ucr/gold_fbi/DDL/gold_fbi.sql:/docker-entrypoint-initdb.d/155_gold_fbi.sql:ro
      - ../../src/data_ingestion_toolbox/usda_nass/gold_nass/DDL/gold_nass.sql:/docker-entrypoint-initdb.d/160_gold_nass.sql:ro
      - ../../src/data_ingestion_toolbox/census_acs/gold_census/DDL/publisher.sql:/docker-entrypoint-initdb.d/165_publisher_census.sql:ro
      - ../../src/data_ingestion_toolbox/bls/gold_bls/DDL/publisher.sql:/docker-entrypoint-initdb.d/170_publisher_bls.sql:ro
      - ../../src/data_ingestion_toolbox/fred/gold_fred/DDL/publisher.sql:/docker-entrypoint-initdb.d/175_publisher_fred.sql:ro
      - ../../src/data_ingestion_toolbox/cdc/gold_cdc/DDL/publisher.sql:/docker-entrypoint-initdb.d/180_publisher_cdc.sql:ro
      - ../../src/data_ingestion_toolbox/fbi_ucr/gold_fbi/DDL/publisher.sql:/docker-entrypoint-initdb.d/185_publisher_fbi.sql:ro
      - ../../src/data_ingestion_toolbox/usda_nass/gold_nass/DDL/publisher.sql:/docker-entrypoint-initdb.d/190_publisher_nass.sql:ro
      - ../../sql/migrations/028_serving_publishes_a_withheld_value.sql:/docker-entrypoint-initdb.d/195_migration_028.sql:ro
      - ../../sql/gold_contract/002_gold_glossary_schema.sql:/docker-entrypoint-initdb.d/200_glossary_schema.sql:ro
      - ../../sql/migrations/016_publisher_harvest_fingerprint.sql:/docker-entrypoint-initdb.d/205_migration_016.sql:ro
      - ../../sql/migrations/017_serving_full_reserve_run.sql:/docker-entrypoint-initdb.d/210_migration_017.sql:ro
      - ../../sql/migrations/018_geo_grain_vocabulary.sql:/docker-entrypoint-initdb.d/215_migration_018.sql:ro
      - ../../sql/migrations/024_served_place_name.sql:/docker-entrypoint-initdb.d/220_migration_024.sql:ro
      - ../../sql/migrations/026_released_date_is_not_the_refresh_clock.sql:/docker-entrypoint-initdb.d/225_migration_026.sql:ro
      - ../../sql/migrations/003_semantic_policy_extraction.sql:/docker-entrypoint-initdb.d/230_migration_003.sql:ro
      - ../../sql/gold_contract/001_gold_contract_views.sql:/docker-entrypoint-initdb.d/235_contract_views.sql:ro
      - ../../tests/sql/martin_seed.sql:/docker-entrypoint-initdb.d/900_martin_seed.sql:ro
      # `tests/sql/frontend_smoke_seed.sql` is deliberately NOT mounted here.
      # It belongs to the frontend smoke tier and is mounted by
      # `docker-compose.smoke.yml`, which is the only stack that needs it.
      #
      # It used to be mounted here, and this database is also the one the
      # pytest integration tier uses. That was harmless while the seed
      # published one ACS measure; once it grew to one measure per registered
      # source it started colliding with fixtures that assume they are the
      # only writer of their own lineage -- `silver_pep.pep_release` carries a
      # global `UNIQUE (product_code)`, so the seed's row took `alldata` and
      # the PEP fixture's insert was silently swallowed by its own
      # `ON CONFLICT DO NOTHING`, failing a foreign key one statement later.
      # Ten tests errored at setup and CI never saw it, because the
      # `api-integration` job uses a bare service container and lets the
      # fixtures apply the warehouse manifest themselves.
      #
      # Keep the two tiers' content apart. The smoke tier wants a
      # deployment-shaped warehouse; the integration tier wants an empty one
      # its fixtures fill and tear down.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD=martin-test-readonly psql -h 127.0.0.1
          -U martin_test -d population_etl_test -tAc
          'SELECT 1 FROM gold.tile_boundary LIMIT 1' | grep -qx 1
      interval: 2s
      timeout: 5s
      retries: 30

  martin:
    image: ghcr.io/maplibre/martin:1.11.0@sha256:0650e9025f5fcffdc686358114679421b5e6b0ca37b374ad8a66f14709d59d2b
    depends_on:
      postgres:
        condition: service_healthy
    command: --config /etc/martin/martin.yml
    environment:
      MARTIN_DATABASE_URL: postgres://martin_test:martin-test-readonly@postgres:5432/population_etl_test
    ports:
      - "127.0.0.1:${TEST_MARTIN_HOST_PORT:-33000}:3000"
    volumes:
      - ../martin/martin.yml:/etc/martin/martin.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "martin", "--version"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ../../tests/fixtures/martin/api_stub.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    depends_on:
      api:
        condition: service_started
      martin:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEST_MARTIN_PROXY_HOST_PORT:-33001}:80"
    volumes:
      - ../web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/tiles/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TEST_REDIS_HOST_PORT:-56379}:6379"
    tmpfs:
      - /data
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
