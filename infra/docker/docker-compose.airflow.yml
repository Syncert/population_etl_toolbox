services:
  postgres:
    # PostGIS rather than plain Postgres: the warehouse database created
    # beside the metadata database below runs `CREATE EXTENSION postgis` from
    # silver_ref's and every gold schema's DDL, so a stock image cannot host
    # the DAGs this stack exists to run.
    image: postgis/postgis:16-3.5-alpine@sha256:b193e996618e9e632e2c6e268462b350c28a9c871cb0352b32905fc01e0299bd
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      # Airflow's own metadata database. The warehouse is a separate database
      # in the same cluster; see the initdb hook below for why.
      POSTGRES_DB: airflow
      WAREHOUSE_DB_NAME: ${PUBLIC_DATA_DB_NAME:-population_etl}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb/create_warehouse_database.sh:/docker-entrypoint-initdb.d/000_create_warehouse_database.sh:ro
    healthcheck:
      # initdb runs on first start and restarts the server once to apply it;
      # a dependent that waits only for the container sees "the database
      # system is starting up".
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 2s
      timeout: 5s
      retries: 30

  airflow-common: &airflow-common
    build:
      context: ../../
      dockerfile: infra/airflow/Dockerfile
    depends_on:
      - postgres
    env_file:
      - ../airflow/airflow.env.example
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # All Airflow components must share one webserver secret_key or the UI
      # cannot fetch task logs from the scheduler's log server (403 FORBIDDEN).
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-internal-dev-log-signing-key}
      DATA_QUALITY_COMMIT_SHA: ${DATA_QUALITY_COMMIT_SHA:-}
      PUBLIC_DATA_DB_NAME: ${PUBLIC_DATA_DB_NAME:-population_etl}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      BLS_API_KEY: ${BLS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      CDC_SOCRATA_APP_TOKEN: ${CDC_SOCRATA_APP_TOKEN:-}
      FBI_CDE_API_KEY: ${FBI_CDE_API_KEY:-}
      USDA_NASS_API_KEY: ${USDA_NASS_API_KEY:-}
    volumes:
      - ../../:/opt/data_ingestion_toolbox
      # Shared so the webserver reads task logs directly from disk and
      # history survives container recreates.
      - airflow_logs:/opt/airflow/logs
    working_dir: /opt/data_ingestion_toolbox

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email admin@example.com || true;
      airflow connections delete public_data >/dev/null 2>&1 || true;
      airflow connections add public_data --conn-type postgres --conn-host postgres --conn-port 5432 --conn-login airflow --conn-password airflow --conn-schema ${PUBLIC_DATA_DB_NAME:-population_etl};
      airflow pools set census_api 4 'Census Bureau API limit';
      airflow pools set bls_api 4 'BLS API limit';
      airflow pools set fred_api 4 'FRED API limit';
      airflow pools set cdc_api 2 'CDC Open Data API limit';
      airflow pools set fbi_cde_api 2 'FBI Crime Data Explorer API limit';
      airflow pools set usda_nass_api 1 'USDA NASS QuickStats API limit (serialized: QuickStats 403-throttles above ~1 req/s sustained)'
      "

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      - airflow-init
    command: airflow webserver
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"

  airflow-scheduler:
    <<: *airflow-common
    # Stable hostname so served-log URLs stored on task instances stay
    # resolvable across container recreates.
    hostname: airflow-scheduler
    depends_on:
      - airflow-init
    command: airflow scheduler

volumes:
  postgres_data:
  airflow_logs:
