services:
  analytics_postgres:
    image: postgis/postgis:16-3.5-alpine@sha256:b193e996618e9e632e2c6e268462b350c28a9c871cb0352b32905fc01e0299bd
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: population_etl
    ports:
      - "127.0.0.1:${ANALYTICS_DB_HOST_PORT:-5433}:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
      - ../../sql/bootstrap/001_api_readonly.sql:/docker-entrypoint-initdb.d/001_api_readonly.sql:ro

  service_postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "127.0.0.1:${SERVICE_DB_HOST_PORT:-5434}:5432"
    volumes:
      - service_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 5 --timeout-graceful-shutdown 10
    environment:
      DB_HOST: ${ANALYTICS_DB_HOST:-analytics_postgres}
      DB_PORT: ${ANALYTICS_DB_PORT:-5432}
      DB_USER: ${ANALYTICS_API_DB_USER:-api_reader}
      DB_PASSWORD: ${ANALYTICS_API_DB_PASSWORD:-api_reader}
      DB_NAME: ${ANALYTICS_DB_NAME:-population_etl}
      # apps.api reads a single SQLAlchemy URL; keep it in lockstep with DB_*.
      DATABASE_URL: postgresql+psycopg2://${ANALYTICS_API_DB_USER:-api_reader}:${ANALYTICS_API_DB_PASSWORD:-api_reader}@${ANALYTICS_DB_HOST:-analytics_postgres}:${ANALYTICS_DB_PORT:-5432}/${ANALYTICS_DB_NAME:-population_etl}
      REDIS_URL: redis://redis:6379/0
      API_CACHE_TTL_SECONDS: ${API_CACHE_TTL_SECONDS:-300}
      # Staleness bound after a warehouse publication (API-006): the response
      # cache re-keys on the published harvest state within this window.
      API_CACHE_FRESHNESS_SECONDS: ${API_CACHE_FRESHNESS_SECONDS:-15}
      # Declared database budgets: fail fast on an exhausted pool, cancel
      # runaway statements server-side, bound connect attempts.
      API_DB_POOL_SIZE: ${API_DB_POOL_SIZE:-5}
      API_DB_MAX_OVERFLOW: ${API_DB_MAX_OVERFLOW:-10}
      API_DB_POOL_TIMEOUT_SECONDS: ${API_DB_POOL_TIMEOUT_SECONDS:-5}
      API_DB_CONNECT_TIMEOUT_SECONDS: ${API_DB_CONNECT_TIMEOUT_SECONDS:-5}
      API_DB_STATEMENT_TIMEOUT_MS: ${API_DB_STATEMENT_TIMEOUT_MS:-15000}
      # Per-client budgets by cost class; catalog reads are cheap, analytical
      # reads reach the warehouse. 0 disables a bucket.
      API_RATE_LIMIT_CATALOG_PER_MINUTE: ${API_RATE_LIMIT_CATALOG_PER_MINUTE:-600}
      API_RATE_LIMIT_ANALYSIS_PER_MINUTE: ${API_RATE_LIMIT_ANALYSIS_PER_MINUTE:-240}
    depends_on:
      - analytics_postgres
      - redis
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ../../:/opt/data_ingestion_toolbox
    working_dir: /opt/data_ingestion_toolbox
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      # Readiness, not liveness: the probe fails while the database is
      # unreachable so orchestration stops routing here.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',
          timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  martin:
    image: ghcr.io/maplibre/martin:1.11.0@sha256:0650e9025f5fcffdc686358114679421b5e6b0ca37b374ad8a66f14709d59d2b
    depends_on:
      - analytics_postgres
    command: --config /etc/martin/martin.yml
    environment:
      MARTIN_DATABASE_URL: postgres://${ANALYTICS_API_DB_USER:-api_reader}:${ANALYTICS_API_DB_PASSWORD:-api_reader}@${ANALYTICS_DB_HOST:-analytics_postgres}:${ANALYTICS_DB_PORT:-5432}/${ANALYTICS_DB_NAME:-population_etl}
    ports:
      - "127.0.0.1:${MARTIN_HOST_PORT:-3000}:3000"
    volumes:
      - ../martin/martin.yml:/etc/martin/martin.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        API_ORIGIN: http://api:8000
        TILES_ORIGIN: http://martin:3000
    depends_on:
      - api
      - martin
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3001}:3100"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  airflow-common: &airflow-common
    build:
      context: ../../
      dockerfile: infra/airflow/Dockerfile
    depends_on:
      - service_postgres
    env_file:
      - ../airflow/airflow.env.example
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # All Airflow components must share one webserver secret_key or the UI
      # cannot fetch task logs from the scheduler's log server (403 FORBIDDEN).
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-internal-dev-log-signing-key}
      DATA_QUALITY_COMMIT_SHA: ${DATA_QUALITY_COMMIT_SHA:-}
      PUBLIC_DATA_DB_NAME: ${PUBLIC_DATA_DB_NAME:-population_etl}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_DB_USER:-airflow}:${AIRFLOW_METADATA_DB_PASSWORD:-airflow}@${AIRFLOW_METADATA_DB_HOST:-service_postgres}:${AIRFLOW_METADATA_DB_PORT:-5432}/${AIRFLOW_METADATA_DB_NAME:-airflow}
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      BLS_API_KEY: ${BLS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      CDC_SOCRATA_APP_TOKEN: ${CDC_SOCRATA_APP_TOKEN:-}
      FBI_CDE_API_KEY: ${FBI_CDE_API_KEY:-}
      USDA_NASS_API_KEY: ${USDA_NASS_API_KEY:-}
    volumes:
      - ../../:/opt/data_ingestion_toolbox
      # Shared so the webserver reads task logs directly from disk and
      # history survives container recreates.
      - airflow_logs:/opt/airflow/logs
    working_dir: /opt/data_ingestion_toolbox

  airflow-init:
    <<: *airflow-common
    depends_on:
      - service_postgres
      - analytics_postgres
    entrypoint: /bin/bash
    command: >
      -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email admin@example.com || true;
      airflow connections delete public_data >/dev/null 2>&1 || true;
      airflow connections add public_data --conn-type postgres --conn-host ${PUBLIC_DATA_DB_HOST:-${ANALYTICS_DB_HOST:-analytics_postgres}} --conn-port ${PUBLIC_DATA_DB_PORT:-${ANALYTICS_DB_PORT:-5432}} --conn-login ${PUBLIC_DATA_DB_USER:-${ANALYTICS_DB_USER:-analytics}} --conn-password ${PUBLIC_DATA_DB_PASSWORD:-${ANALYTICS_DB_PASSWORD:-analytics}} --conn-schema ${PUBLIC_DATA_DB_NAME:-${ANALYTICS_DB_NAME:-population_etl}};
      airflow pools set census_api 4 'Census Bureau API limit';
      airflow pools set bls_api 4 'BLS API limit';
      airflow pools set fred_api 4 'FRED API limit';
      airflow pools set cdc_api 2 'CDC Open Data API limit';
      airflow pools set fbi_cde_api 2 'FBI Crime Data Explorer API limit';
      airflow pools set usda_nass_api 1 'USDA NASS QuickStats API limit (serialized: QuickStats 403-throttles above ~1 req/s sustained)'
      "

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      - airflow-init
      - redis
    command: airflow webserver
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"

  airflow-scheduler:
    <<: *airflow-common
    # Stable hostname so served-log URLs stored on task instances stay
    # resolvable across container recreates.
    hostname: airflow-scheduler
    depends_on:
      - airflow-init
      - redis
    command: airflow scheduler

volumes:
  airflow_logs:
  analytics_postgres_data:
  service_postgres_data:
