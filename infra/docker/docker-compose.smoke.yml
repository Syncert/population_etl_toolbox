# Overlay that swaps the disposable stack's API stub for the real API.
#
# docker-compose.test.yml serves /api/v1/health from a small nginx stub and
# 404s everything else. That is exactly what the deployment contracts need,
# and it keeps that job from building a Python image for a health check.
#
# The frontend smoke tier needs the opposite: the real router table, the real
# registry dispatch, and the real generated SQL, reached over the same nginx
# rewrites a browser uses. Compose merges the two files field by field, not
# service by service: a scalar declared here replaces the base file's, but a
# sequence declared here is appended to it. So this overlay reshapes the `api`
# service and adds exactly one volume to `postgres`, and states nothing else
# the base file already states; Martin and the proxy stay exactly as the
# deployment tier composes them, which is the point — the smoke tier must not
# get a stack of its own to be right about.
#
#   docker compose -f docker-compose.test.yml -f docker-compose.smoke.yml \
#     up --detach --wait postgres martin api proxy

services:
  postgres:
    # This tier's seed, mounted by the only stack that wants it.
    #
    # It lived in the base file until the seed grew from one ACS measure to
    # one per registered source, at which point it started colliding with the
    # pytest integration fixtures that share that database -- see the comment
    # where it used to sit in `docker-compose.test.yml`. Content this tier
    # needs and the integration tier must not see belongs here.
    #
    # `volumes` is a sequence, so Compose appends this to the base file's
    # list rather than replacing it; every migration and DDL mount there
    # still applies. The `051_` prefix keeps it ordered after
    # `050_martin_seed.sql`, whose Dane County geography and `martin_test`
    # role this seed and the base healthcheck both depend on.
    volumes:
      - ../../tests/sql/frontend_smoke_seed.sql:/docker-entrypoint-initdb.d/051_frontend_smoke_seed.sql:ro

  api:
    # `image` names the build output rather than selecting a registry image;
    # the base file's pinned nginx digest is a scalar and is replaced here.
    image: population-etl-api:smoke
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The disposable Postgres owns every relation the API reads. This is
      # the superuser the test stack creates, not a production-shaped
      # read-only role: the privilege split has its own contracts, and
      # borrowing them here would make a permission drift look like a
      # frontend defect.
      DATABASE_URL: postgresql+psycopg2://population_test:population_test@postgres:5432/population_etl_test
      # Left unset deliberately: no Redis-backed response cache, so a smoke
      # failure is a contract failure and never a stale cached page.
      API_CACHE_TTL_SECONDS: "0"
      # APP_API_DATABASE_URL is unset, so the saved-analysis routes answer an
      # explicit 503. The smoke tier does not exercise them.
    ports:
      - "127.0.0.1:${TEST_API_HOST_PORT:-38000}:8000"
    read_only: true
    # `tmpfs` and `security_opt` are deliberately not restated here. Compose
    # appends sequences across merged files rather than replacing them, so
    # repeating the base file's `/tmp` and `no-new-privileges:true` built a
    # list holding each value twice and Compose refused the stack outright:
    # `services.api.security_opt items at 0 and 1 are equal`. The base file
    # already hardens this container and already gives it the writable `/tmp`
    # a read-only root filesystem needs.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',
          timeout=3).status == 200 else 1)"
      interval: 3s
      timeout: 5s
      retries: 40

  web:
    # The application itself, which the deployment stack composes and no CI
    # job ran until now.
    #
    # It is here because the client-report sink is a Next route handler: a
    # browser's account of what went wrong is a POST to `/client-report` in
    # *this* process, written to *this* container's stdout. Nothing outside
    # this container can be asked whether that path works, so a tier that
    # never starts it cannot prove the reports arrive -- which is what
    # WEB-114's browser tests, running against a dev server, do not answer
    # (DEPLOY-011).
    #
    # `APP_API_DATABASE_URL` is unset here for the same reason it is unset on
    # the API above: this tier does not exercise the saved-analysis routes.
    image: population-etl-web:smoke
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Baked at build time by `next build`, so they name the service
        # addresses on this stack's network rather than a deployment's.
        API_ORIGIN: http://api:8000
        TILES_ORIGIN: http://martin:3000
        # Empty falls back to `development` in `next.config.mjs`.
        NEXT_PUBLIC_BUILD_ID: ${GITHUB_SHA:-}
    depends_on:
      api:
        condition: service_healthy
      martin:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEST_WEB_HOST_PORT:-33100}:3100"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # `node` is what this image has; there is no curl or wget in it, and a
      # healthcheck that shells out to a binary the image does not carry is a
      # container that never reports healthy and a `--wait` that times out
      # with nothing to read.
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3100/',
          (r) => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 40

  proxy:
    # The base file waits only for the stub to start, which is immediate. The
    # real API has a database to reach first, so the proxy must wait for it to
    # report ready or the first smoke request races the pool.
    depends_on:
      api:
        condition: service_healthy
      martin:
        condition: service_healthy
