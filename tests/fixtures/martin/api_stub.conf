server {
    listen 8000;
    server_name _;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/health {
        default_type application/json;
        return 200 '{"service":"api-stub","status":"ok"}';
    }

    location / {
        default_type application/json;
        return 404 '{"detail":"test API stub"}';
    }
}
