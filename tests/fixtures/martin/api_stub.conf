server {
    listen 8000;
    server_name _;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Mirrors the real API's surface: versioned resources only. The
    # unversioned /api aliases were retired in API-008, so a stub that still
    # answered /api/health would prove a route the deployment does not serve.
    location = /api/v1/health {
        default_type application/json;
        return 200 '{"service":"api-stub","status":"ok"}';
    }

    location = /health/ready {
        default_type application/json;
        return 200 '{"status":"ready","database":"ok","cache":"disabled"}';
    }

    location / {
        default_type application/json;
        return 404 '{"detail":"test API stub"}';
    }
}
