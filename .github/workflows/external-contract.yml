name: external-contract

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Census, PEP, BLS, FRED, CDC, FBI UCR, and USDA NASS live contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine@sha256:b193e996618e9e632e2c6e268462b350c28a9c871cb0352b32905fc01e0299bd
        env:
          POSTGRES_USER: population_test
          POSTGRES_PASSWORD: population_test
          POSTGRES_DB: population_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U population_test -d population_etl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_EXTERNAL_TESTS: "1"
      RUN_INTEGRATION_TESTS: "1"
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: population_test
      TEST_POSTGRES_PASSWORD: population_test
      TEST_POSTGRES_DATABASE: population_etl_test
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # Required by the providers: the CDE API is keyed through api.data.gov
      # and Quick Stats refuses an unkeyed request.
      FBI_CDE_API_KEY: ${{ secrets.FBI_CDE_API_KEY }}
      USDA_NASS_API_KEY: ${{ secrets.USDA_NASS_API_KEY }}
      # Optional: raises CDC Socrata rate limits; anonymous reads still work.
      CDC_SOCRATA_APP_TOKEN: ${{ secrets.CDC_SOCRATA_APP_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install source contract dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate scheduled external credentials
        run: python -m tests.support.external

      - name: Run external source contracts
        run: >-
          pytest tests/external tests/integration/database/legacy
          -m external --tb=short -q -ra
          --junitxml=junit-external.xml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: external-contract-results
          path: junit-external.xml
