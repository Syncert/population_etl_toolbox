name: etl-unit

on:
  pull_request:
  push:
    branches: [main, "copilot/**", "feat/**"]

permissions:
  contents: read

jobs:
  etl-unit:
    name: ETL unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-etl-${{ hashFiles('pyproject.toml') }}

      - name: Install package + dev dependencies
        run: |
          pip install -e ".[dev]"
          pip check

      - name: Run ETL unit tests
        run: pytest -m "unit and not api" --tb=short -q --cov=src --cov-report=xml:coverage-etl.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-etl
          path: coverage-etl.xml
