name: redis-integration

on:
  pull_request:
    paths:
      - "apps/api/middleware.py"
      - "tests/integration/redis/**"
      - "tests/unit/api/test_cache_middleware.py"
      - "tests/unit/shared/test_redis_test_config.py"
      - "tests/support/redis.py"
      - "pyproject.toml"
      - ".github/workflows/redis-integration.yml"
  push:
    branches: [main, "copilot/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-cache:
    name: API cache integration (Redis 7 + Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_INTEGRATION_TESTS: "1"
      TEST_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-redis-py311-${{ hashFiles('pyproject.toml') }}

      - name: Install API and test dependencies
        run: |
          python -m pip install -e ".[api,dev]"
          python -m pip check

      - name: Run cache middleware unit tests
        run: >-
          pytest tests/unit/api/test_cache_middleware.py
          -m "unit and api" --tb=short -q

      - name: Run Redis integration tests
        run: >-
          pytest tests/integration/redis
          -m "integration and api and redis"
          --tb=short -q --junitxml=junit-redis.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-redis
          path: junit-redis.xml
