name: api-unit

on:
  pull_request:
  push:
    branches: [main, "copilot/**", "feat/**"]

jobs:
  api-unit:
    name: API unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-api-${{ hashFiles('pyproject.toml') }}

      - name: Install package + API + dev dependencies
        run: |
          pip install -e ".[api,dev]"
          pip check

      - name: Run API unit tests
        run: pytest -m "unit and api" --tb=short -q --cov=apps --cov-report=xml:coverage-api.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-api
          path: coverage-api.xml
