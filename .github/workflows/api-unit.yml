name: api-unit

on:
  pull_request:
  push:
    branches: [main, "copilot/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    name: API unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4.2.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-api-py311-${{ hashFiles('pyproject.toml') }}

      - name: Install package + API + dev dependencies
        run: |
          python -m pip install -e ".[api,dev]"
          python -m pip check

      - name: Run API unit tests
        run: >-
          pytest -m "unit and api" tests/unit/api --tb=short -q
          --cov=apps --cov-report=xml:coverage-api.xml
          --junitxml=junit-api.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: coverage-api
          path: |
            coverage-api.xml
            junit-api.xml
