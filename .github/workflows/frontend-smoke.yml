name: frontend-smoke

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "infra/docker/docker-compose.test.yml"
      - "infra/docker/docker-compose.smoke.yml"
      - "infra/docker/Dockerfile.api"
      - "infra/docker/Dockerfile.web"
      - "infra/martin/**"
      - "infra/web/**"
      - "sql/**"
      - "tests/frontend/smoke/**"
      - "tests/sql/**"
      - ".github/workflows/frontend-smoke.yml"
  push:
    # Every branch prefix the plan inventory declares, so a plan's work
    # gets CI feedback on push and not only once a pull request exists
    # (ENV-012). Guarded by tests/unit/shared/test_ci_evidence_manifest.py.
    branches:
      - main
      - "claude/**"
      - "copilot/**"
      - "docs/**"
      - "feat/**"
      - "fix/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Frontend live-stack smoke
    # Covers: WEB-027 — the explorer's own discovery and request-building
    # modules run unmocked against a deployed API, Martin, and proxy. This is
    # the tier that sees what a fixture cannot: a response whose shape the
    # client reads wrongly, where the server was right all along.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The proxy origin, which serves /api/v1 and /tiles through the same
      # rewrites a browser uses.
      SMOKE_BASE_URL: http://127.0.0.1:33001
      # The web container's own origin. The smoke tier above goes through the
      # proxy; the client-report sink is inside the Next process and is
      # reached directly, which is also how a reader reaches it.
      WEB_SMOKE_URL: http://127.0.0.1:33100
      # Refuse to pass by skipping.
      SMOKE_REQUIRED: "1"
      # Grade the stack against every registered source, not just the ones
      # that happen to be loaded. This became possible when
      # `tests/sql/frontend_smoke_seed.sql` grew from one ACS measure to one
      # per source: before that, six of seven sources were legitimately
      # silent here and this bound could only have been satisfied by
      # weakening it. Now it is the thing that keeps the seed honest -- a
      # source dropped from the seed, or a dispatch entry that stops
      # resolving its lineage, fails this job at pull-request time instead of
      # surviving until someone opens that source in the deployed explorer.
      SMOKE_REQUIRE_ALL_SOURCES: "1"
      # Every visualization the web offers must answer, for every source the
      # reviewed matrix says it serves (WEB-104). The matrix is the coverage
      # claim -- "all web viz, all sources" -- and this is the run that turns
      # it from a declaration into a request. Both bounds are on here because
      # this stack's content is seeded and therefore known: a violation can
      # only mean a screen stopped being servable, never that a warehouse is
      # part-way through a load. A deployment opts in separately.
      SMOKE_REQUIRE_ALL_VIZ: "1"
      SMOKE_REQUIRE_FULL_VIZ_SAMPLE: "1"
      # And no source may be drifting. The seed publishes only measures the
      # publisher is still emitting, so this bound is free here -- which is
      # exactly why it belongs here: it keeps the drift check exercised on
      # every pull request, against a stack where a violation can only mean
      # the rule or the report broke, never that a provider discontinued a
      # series. Deployments opt in separately.
      SMOKE_REQUIRE_FRESH_SOURCES: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Start the deployed stack
        run: >-
          docker compose -f infra/docker/docker-compose.test.yml
          -f infra/docker/docker-compose.smoke.yml
          up --detach --wait postgres martin api proxy web
      - name: Run the live-stack smoke tier
        working-directory: apps/web
        run: npm run test:smoke
      # The API's only request-level operational signal is the completion
      # line `apps.api.telemetry` writes at INFO, and nothing configured
      # logging for the deployed process, so every one of those lines was
      # dropped by a real container while the unit tests -- which install
      # their own handler -- stayed green (API-143). This is the only job
      # that runs the real API image, so it is the only place that can see
      # whether the line survives the process it actually runs in (DEPLOY-009).
      - name: The deployed API logs its request completion lines
        run: |
          set -euo pipefail
          probe_id="smoke-$(date +%s)-$$"
          curl --fail --silent --show-error \
            --header "X-Request-ID: ${probe_id}" \
            "http://127.0.0.1:${TEST_API_HOST_PORT:-38000}/health" > /dev/null
          # The line is written after the response is sent.
          sleep 2
          logs="$(docker compose -f infra/docker/docker-compose.test.yml \
            -f infra/docker/docker-compose.smoke.yml logs --no-color api)"
          echo "${logs}" | tail -20
          # The id the client sent, in the server's own record of that
          # request -- which is the promise the consumer guide makes.
          echo "${logs}" | grep -F "api_request" | grep -F "request_id=${probe_id}"
      # The client-report sink is a Next route handler, so a browser's account
      # of what went wrong is a POST to `/client-report` in the web process and
      # a line on that container's stdout. The unit tier builds the payloads
      # with no browser; the browser tier drives a real Chromium but against
      # `next dev` on the runner, where there is no container and so no
      # container log. This is the only job that runs the web image, so it is
      # the only place the whole path can be seen (WEB-114, DEPLOY-011).
      - name: Install the browser the vitals navigation needs
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: A browser visits the deployed web container
        working-directory: apps/web
        run: npm run report:vital -- "${WEB_SMOKE_URL}"
      - name: The deployed web container records the client report
        run: |
          set -euo pipefail
          # The sink writes the line as it answers, and `logs` is read after
          # the navigation has already been observed on the wire.
          logs="$(docker compose -f infra/docker/docker-compose.test.yml             -f infra/docker/docker-compose.smoke.yml logs --no-color web)"
          echo "${logs}" | tail -20
          echo "${logs}" | grep -F "client_report kind=vital"
      - name: Capture service logs
        if: failure()
        run: >-
          docker compose -f infra/docker/docker-compose.test.yml
          -f infra/docker/docker-compose.smoke.yml logs --no-color
          > frontend-smoke.log
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: frontend-smoke-logs
          path: frontend-smoke.log
          if-no-files-found: ignore
      - name: Stop and remove the stack
        if: always()
        run: >-
          docker compose -f infra/docker/docker-compose.test.yml
          -f infra/docker/docker-compose.smoke.yml
          down --volumes --remove-orphans --timeout 15
