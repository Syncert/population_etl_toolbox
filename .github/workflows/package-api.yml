name: package-api
# Covers: ENV-001, ENV-005 — fresh API install and clean package build contracts.

on:
  pull_request:
  push:
    branches: [main, "copilot/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-api:
    name: Package build and install smoke (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-build-${{ hashFiles('pyproject.toml') }}

      - name: Install build tools
        run: python -m pip install build==1.2.2.post1

      - name: Build wheel and sdist
        run: python -m build --outdir dist/

      - name: Install wheel into clean environment
        run: |
          python -m venv .package-smoke
          WHEEL="$(find dist -name '*.whl' -print -quit)"
          .package-smoke/bin/python -m pip install --upgrade pip
          .package-smoke/bin/python -m pip install "${WHEEL}[api]"
          .package-smoke/bin/python -m pip check

      - name: Import smoke test
        run: >-
          .package-smoke/bin/python -c
          "import data_ingestion_toolbox; import apps.api.main; print('import ok')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
