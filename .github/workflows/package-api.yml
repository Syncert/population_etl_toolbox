name: package-api
# Covers: ENV-001, ENV-005 — fresh API install and clean package build contracts.

on:
  pull_request:
  push:
    # Every branch prefix the plan inventory declares, so a plan's work
    # gets CI feedback on push and not only once a pull request exists
    # (ENV-012). Guarded by tests/unit/shared/test_ci_evidence_manifest.py.
    branches:
      - main
      - "claude/**"
      - "copilot/**"
      - "docs/**"
      - "feat/**"
      - "fix/**"
      - "test/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-api:
    name: Package build and install smoke (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-build-${{ hashFiles('pyproject.toml') }}

      - name: Install build tools
        run: python -m pip install build==1.2.2.post1

      - name: Build wheel and sdist
        run: python -m build --outdir dist/

      - name: Validate distribution contents
        run: >-
          python -m tests.support.package_artifacts
          --wheel "$(find dist -name '*.whl' -print -quit)"
          --sdist "$(find dist -name '*.tar.gz' -print -quit)"

      - name: Install wheel into clean environment
        run: |
          python -m venv .package-smoke
          WHEEL="$(find dist -name '*.whl' -print -quit)"
          .package-smoke/bin/python -m pip install --upgrade pip
          # The dependency set comes from the reviewed lock, by hash, and the
          # wheel is then installed against it without resolving again
          # (ENV-022). Installing `${WHEEL}[api]` on its own re-resolved every
          # range in `pyproject.toml`, so this job graded a package built from
          # one dependency set and installed against whatever PyPI answered
          # that morning -- which is not the set the image ships.
          .package-smoke/bin/python -m pip install --require-hashes \
            -r requirements/api.lock.txt
          .package-smoke/bin/python -m pip install --no-deps "${WHEEL}"
          .package-smoke/bin/python -m pip check

      - name: Import smoke test
        run: >-
          .package-smoke/bin/python -c
          "import data_ingestion_toolbox; import apps.api.main; print('import ok')"

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
