name: martin-unit

on:
  pull_request:
    paths:
      - "infra/martin/**"
      - "infra/docker/docker-compose*.yml"
      - "infra/web/nginx.conf"
      - "apps/web/next.config.mjs"
      - "src/data_ingestion_toolbox/martin_contract.py"
      - "tests/support/martin.py"
      - "tests/unit/martin/**"
      - "pyproject.toml"
      - ".github/workflows/martin-unit.yml"
  push:
    # Every branch prefix the plan inventory declares, so a plan's work
    # gets CI feedback on push and not only once a pull request exists
    # (ENV-012). Guarded by tests/unit/shared/test_ci_evidence_manifest.py.
    branches:
      - main
      - "claude/**"
      - "copilot/**"
      - "docs/**"
      - "feat/**"
      - "fix/**"
      - "test/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  martin-unit:
    name: Martin deterministic contracts (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run Martin unit contracts
        run: >-
          pytest -m unit tests/unit/martin --tb=short -q
          --junitxml=junit-martin-unit.xml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: martin-unit-results
          path: junit-martin-unit.xml
