name: martin-unit

on:
  pull_request:
    paths:
      - "infra/martin/**"
      - "infra/docker/docker-compose*.yml"
      - "infra/web/nginx.conf"
      - "apps/web/next.config.mjs"
      - "src/data_ingestion_toolbox/martin_contract.py"
      - "tests/support/martin.py"
      - "tests/unit/martin/**"
      - "pyproject.toml"
      - ".github/workflows/martin-unit.yml"
  push:
    branches: [main, "copilot/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  martin-unit:
    name: Martin deterministic contracts (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4.2.0

      - uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run Martin unit contracts
        run: >-
          pytest -m unit tests/unit/martin --tb=short -q
          --junitxml=junit-martin-unit.xml

      - uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: martin-unit-results
          path: junit-martin-unit.xml
