name: coverage

on:
  pull_request:
  push:
    branches: [main, "copilot/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Unit coverage gates (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-coverage-py311-${{ hashFiles('pyproject.toml') }}

      - name: Install API and test dependencies
        run: |
          python -m pip install -e ".[api,dev]"
          python -m pip check

      - name: Run deterministic unit coverage
        # Covers: PERF-001 — deterministic unit tests must finish within 120 seconds.
        run: >-
          timeout 120s pytest tests/unit -q --tb=short
          --cov=apps --cov=data_ingestion_toolbox
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-fail-under=33
          --junitxml=junit-coverage.xml

      - name: Enforce changed-line coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD^"
          fi
          python scripts/check_changed_coverage.py \
            --coverage coverage.json --base-ref "$BASE_REF" --minimum 80

      - name: Enforce critical pure-module coverage
        run: >-
          coverage report --fail-under=90
          --include="src/data_ingestion_toolbox/normalization.py,src/data_ingestion_toolbox/*/silver_*/time_utils.py,src/data_ingestion_toolbox/census_acs/silver_census/geography_mapper.py,src/data_ingestion_toolbox/bls/geography.py"

      - name: Upload coverage and test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
            junit-coverage.xml
