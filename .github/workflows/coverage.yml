name: coverage

on:
  pull_request:
  push:
    branches: [main, "copilot/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Unit + database coverage gates (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine@sha256:b193e996618e9e632e2c6e268462b350c28a9c871cb0352b32905fc01e0299bd
        env:
          POSTGRES_USER: population_test
          POSTGRES_PASSWORD: population_test
          POSTGRES_DB: population_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U population_test -d population_etl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_INTEGRATION_TESTS: "1"
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: population_test
      TEST_POSTGRES_PASSWORD: population_test
      TEST_POSTGRES_DATABASE: population_etl_test

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-coverage-py311-${{ hashFiles('pyproject.toml') }}

      - name: Install API and test dependencies
        run: |
          python -m pip install -e ".[api,dev]"
          python -m pip check

      - name: Run deterministic unit coverage
        # Covers: PERF-001 — deterministic unit tests must finish within 120 seconds.
        run: >-
          timeout 120s pytest tests/unit -q --tb=short
          --cov=apps --cov=data_ingestion_toolbox
          --cov-report=
          --junitxml=junit-coverage.xml

      - name: Merge bounded warehouse execution coverage
        run: >-
          pytest tests/integration/database
          -m "integration and database and not slow"
          --tb=short -q
          --cov=apps --cov=data_ingestion_toolbox --cov-append
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --junitxml=junit-coverage-database.xml

      - name: Enforce checked-in overall coverage ratchet
        run: >-
          python -m tests.support.coverage_ratchet
          --coverage coverage.json
          --baseline tests/coverage/baseline.json

      - name: Enforce changed-line coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD^"
          fi
          python -m tests.support.changed_coverage \
            --coverage coverage.json --base-ref "$BASE_REF" --minimum 80

      - name: Enforce critical pure-module coverage
        run: >-
          coverage report --fail-under=90
          --include="src/data_ingestion_toolbox/normalization.py,src/data_ingestion_toolbox/*/silver_*/time_utils.py,src/data_ingestion_toolbox/census_acs/silver_census/geography_mapper.py,src/data_ingestion_toolbox/bls/geography.py"

      - name: Upload coverage and test reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
            junit-coverage.xml
            junit-coverage-database.xml
