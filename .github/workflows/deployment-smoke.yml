name: deployment-smoke

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "src/data_ingestion_toolbox/**"
      - "sql/**"
      - "infra/docker/**"
      - "infra/web/**"
      - "infra/martin/**"
      - "tests/integration/deployment/**"
      - "tests/unit/deployment/**"
      - "tools/deployment.py"
      - "scripts/deploy_stack.py"
      - "scripts/deploy_stack.ps1"
      - ".github/workflows/deployment-smoke.yml"
  push:
    # Every branch prefix the plan inventory declares, so a plan's work
    # gets CI feedback on push and not only once a pull request exists
    # (ENV-012). Guarded by tests/unit/shared/test_ci_evidence_manifest.py.
    branches:
      - main
      - "claude/**"
      - "copilot/**"
      - "docs/**"
      - "feat/**"
      - "fix/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Deployment compose smoke
    # Covers: DEPLOY-002, DEPLOY-003 — healthy startup and complete teardown.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_INTEGRATION_TESTS: "1"
      RUN_COMPOSE_TESTS: "1"
      RUN_MARTIN_TESTS: "1"
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "55432"
      TEST_POSTGRES_USER: population_test
      TEST_POSTGRES_PASSWORD: population_test
      TEST_POSTGRES_DATABASE: population_etl_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[api,dev]"
      - run: python -m pip check
      - name: Validate static deployment contracts
        run: pytest -o addopts='' tests/unit/deployment --tb=short -q
      # The decisions above are graded without Docker. The execution loop is
      # the one part of the deployment path that needs a daemon, so it is
      # exercised here against the disposable stack rather than left to a
      # reviewer's workstation: the entrypoint an operator runs is the
      # entrypoint CI runs (DEPLOY-008).
      #
      # `--compose-file` points it at the test stack. That stack has no
      # `airflow-init`, so `init` is not run here and the isolation refusal
      # stays covered by the unit tests above; what this proves is that the
      # loop invokes Compose, starts containers, stops them, and propagates a
      # failure instead of swallowing it.
      - name: Deployment entrypoint starts and stops the disposable stack
        run: |
          set -euo pipefail
          python scripts/deploy_stack.py --use-host-env --action up \
            --compose-file infra/docker/docker-compose.test.yml
          started="$(docker compose -f infra/docker/docker-compose.test.yml ps -q | wc -l)"
          echo "containers after up: ${started}"
          test "${started}" -gt 0
          python scripts/deploy_stack.py --use-host-env --action down \
            --compose-file infra/docker/docker-compose.test.yml
          remaining="$(docker compose -f infra/docker/docker-compose.test.yml ps -q | wc -l)"
          echo "containers after down: ${remaining}"
          test "${remaining}" -eq 0
      - name: Deployment entrypoint propagates a Compose failure
        run: |
          set +e
          python scripts/deploy_stack.py --use-host-env --action down \
            --compose-file infra/docker/docker-compose.does-not-exist.yml
          status=$?
          set -e
          echo "exit status on a missing compose file: ${status}"
          test "${status}" -ne 0
      - name: Start disposable application dependencies
        run: >-
          docker compose -f infra/docker/docker-compose.test.yml
          up --detach --wait postgres redis martin proxy
      - name: Validate composed services
        run: >-
          pytest -o addopts='' -m "integration and deployment"
          tests/integration/deployment --tb=short -q
      - name: Capture logs
        if: failure()
        run: >-
          docker compose -f infra/docker/docker-compose.test.yml logs --no-color
          > deployment-compose.log
      - name: Stop and remove disposable services
        if: always()
        run: >-
          docker compose -f infra/docker/docker-compose.test.yml
          down --volumes --remove-orphans --timeout 15
      - name: Verify clean shutdown
        if: always()
        run: test -z "$(docker compose -f infra/docker/docker-compose.test.yml ps -q)"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: deployment-smoke-logs
          path: deployment-compose.log
