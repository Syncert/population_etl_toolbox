name: dag-parse
# Covers: ENV-002 — fresh Airflow/ETL install and dependency compatibility.

on:
  pull_request:
    paths:
      - "dags/**"
      - "src/**"
      - "pyproject.toml"
  push:
    branches: [main, "copilot/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dag-parse:
    name: DAG parse tests (Airflow 2.9.3 + Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine@sha256:b193e996618e9e632e2c6e268462b350c28a9c871cb0352b32905fc01e0299bd
        env:
          POSTGRES_USER: population_test
          POSTGRES_PASSWORD: population_test
          POSTGRES_DB: population_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U population_test -d population_etl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: population_test
      TEST_POSTGRES_PASSWORD: population_test
      TEST_POSTGRES_DATABASE: population_etl_test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-dag-py311-airflow293-${{ hashFiles('pyproject.toml') }}

      - name: Install package + Airflow 2.9.3 + dev dependencies
        run: |
          python -m pip install \
            apache-airflow==2.9.3 \
            apache-airflow-providers-postgres==5.11.2 \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt"
          python -m pip install -e ".[airflow-dev]"
          python -m pip check
          python -c "import airflow; assert airflow.__version__ == '2.9.3'"
          python -c "from importlib.metadata import version; assert version('apache-airflow-providers-postgres') == '5.11.2'"

      - name: Run DAG tests
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          RUN_DAG_TESTS: "1"
        run: >-
          pytest -m dag tests/dags/ --tb=short -q
          --cov=dags --cov-report=xml:coverage-dags.xml
          --junitxml=junit-dags.xml

      - name: Upload DAG test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-dags
          path: |
            junit-dags.xml
            coverage-dags.xml
