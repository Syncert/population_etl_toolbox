name: postgres-integration

on:
  pull_request:
    paths:
      - "src/data_ingestion_toolbox/**/DDL/**"
      - "sql/gold_contract/**"
      - "tests/integration/database/**"
      - "tests/support/postgres.py"
      - "pyproject.toml"
      - ".github/workflows/postgres-integration.yml"
  push:
    branches: [main, "copilot/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warehouse-database:
    name: Warehouse integration (PostGIS 16 + Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine@sha256:b193e996618e9e632e2c6e268462b350c28a9c871cb0352b32905fc01e0299bd
        env:
          POSTGRES_USER: population_test
          POSTGRES_PASSWORD: population_test
          POSTGRES_DB: population_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U population_test -d population_etl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_INTEGRATION_TESTS: "1"
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: population_test
      TEST_POSTGRES_PASSWORD: population_test
      TEST_POSTGRES_DATABASE: population_etl_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-postgres-py311-${{ hashFiles('pyproject.toml') }}

      - name: Install ETL and test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run warehouse database integration tests
        run: >-
          pytest tests/integration/database
          -m "integration and database and not slow"
          --tb=short -q --junitxml=junit-postgres.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-postgres
          path: junit-postgres.xml
