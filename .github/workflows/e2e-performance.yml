name: e2e-performance

on:
  workflow_dispatch:
    inputs:
      full_million_row_profile:
        description: Run the million-row memory/throughput profile
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-performance:
    name: Bounded E2E and performance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine@sha256:b193e996618e9e632e2c6e268462b350c28a9c871cb0352b32905fc01e0299bd
        env:
          POSTGRES_USER: population_test
          POSTGRES_PASSWORD: population_test
          POSTGRES_DB: population_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U population_test -d population_etl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_INTEGRATION_TESTS: "1"
      RUN_E2E_TESTS: "1"
      RUN_PERFORMANCE_TESTS: "1"
      RUN_FULL_PERFORMANCE_TESTS: ${{ (github.event_name == 'schedule' || inputs.full_million_row_profile) && '1' || '0' }}
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: population_test
      TEST_POSTGRES_PASSWORD: population_test
      TEST_POSTGRES_DATABASE: population_etl_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install API, ETL, and test dependencies
        run: |
          python -m pip install -e ".[api,dev,performance]"
          python -m pip check

      # Covers: E2E-008, E2E-012 — the run is graded against the executable
      # coverage inventory: E2E_REQUIRE_ALL_PRODUCTS fails the session unless
      # every registered data product ran and passed, so a node that is skipped
      # or deselected is a failure rather than a quietly shorter run. The
      # product JUnit file names each product node, so a failure identifies the
      # product rather than the tier.
      - name: Run every registered data-product end-to-end node
        env:
          E2E_REQUIRE_ALL_PRODUCTS: "1"
        run: >-
          pytest tests/e2e -m e2e
          --tb=short -q --junitxml=junit-e2e-products.xml

      - name: Run resilience and operability contracts
        run: >-
          pytest tests/resilience
          tests/integration/database/test_database_operability.py
          tests/integration/api/test_connection_capacity.py
          -m "(e2e or integration) and slow"
          --tb=short -q --junitxml=junit-e2e-resilience.xml

      - name: Run real API/database contract
        run: >-
          pytest tests/integration/api/test_real_database_contract.py
          -m "integration and api and database"
          --tb=short -q --junitxml=junit-api-database.xml

      - name: Run performance contracts
        run: >-
          pytest tests/performance -m performance
          --tb=short -q --junitxml=junit-performance.xml

      - name: Run controlled Locust production-app scenario
        env:
          DATABASE_URL: postgresql+psycopg2://population_test:population_test@127.0.0.1:5432/population_etl_test
          REDIS_URL: redis://127.0.0.1:6379/15
          API_CACHE_TTL_SECONDS: "60"
        run: |
          mkdir -p performance-artifacts
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 >performance-artifacts/uvicorn.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null
          locust -f tests/performance/locustfile.py --headless \
            --users 16 --spawn-rate 8 --run-time 30s \
            --host http://127.0.0.1:8000 \
            --csv performance-artifacts/locust --csv-full-history
          printf '%s\n' \
            'runner=github-hosted ubuntu-latest' \
            'python=3.11' \
            'users=16' \
            'spawn_rate=8' \
            'run_time=30s' \
            'postgres=postgis-16-3.5-alpine' \
            'redis=7.4.9-alpine' \
            > performance-artifacts/runner-metadata.txt

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-performance-results
          path: |
            junit-*.xml
            performance-artifacts/
